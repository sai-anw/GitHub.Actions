name: Cleanup Old GitHub Actions Runs

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: "Delete runs older than how many days?"
        required: true
        type: string
        default: "45"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          DAYS: ${{ inputs.retention_days }}
          REPO: ${{ github.repository }}

        run: |
          CUTOFF=$(date -u -d "$DAYS days ago" +%Y-%m-%d)

          echo "Deleting runs older than $DAYS days..."
          echo "Cutoff: $CUTOFF"

          while true; do

            gh api \
              "/repos/$REPO/actions/runs?created=%3C$CUTOFF&status=completed&per_page=25" \
              --jq '.workflow_runs[].id' > /tmp/runs

            COUNT=$(wc -l < /tmp/runs)

            echo "Found $COUNT runs"

            [ "$COUNT" -eq 0 ] && break

            while read -r ID; do
              echo "Deleting run $ID"
              gh api --method DELETE \
                "/repos/$REPO/actions/runs/$ID"
            done < /tmp/runs

            sleep 2
          done

          echo "Cleanup completed."
